name: Publicar posts avulsos

on:
  push:
    branches: [main]
    paths: ["posts/**/post.json"]   # post urgente aprovado sai na hora
  schedule:
    - cron: "7 15 * * 2-5"   # terça a sexta, 12h07 em Brasília
  workflow_dispatch:
    inputs:
      post_id:
        description: "Nome da pasta do post para publicar AGORA (notícia urgente). Em branco = posts agendados para hoje"
        required: false
      modo_teste:
        description: "Modo teste (não publica nada)"
        type: choice
        options: ["sim", "não"]
        default: "sim"

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    if: vars.PUBLICAR_INSTAGRAM == 'sim'
    env:
      POST_ID: ${{ inputs.post_id }}
      MODO_TESTE: ${{ inputs.modo_teste || vars.MODO_TESTE || 'sim' }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/publicar_post.py
      - name: Registrar o que foi publicado
        if: always()
        run: |
          git config user.name "odonto-em-5-bot"
          git config user.email "odonto-em-5-bot@users.noreply.github.com"
          git add edicoes posts
          git diff --cached --quiet || (git commit -m "Registro de post avulso" && git push)
