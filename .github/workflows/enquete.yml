name: Contar votos da enquete

on:
  schedule:
    - cron: "13 9 * * 6"   # sábado, 6h13 em Brasília, antes da montagem da edição
  workflow_dispatch:
    inputs:
      modo_teste:
        type: choice
        options: ["sim", "não"]
        default: "sim"

permissions:
  contents: write

jobs:
  contar:
    runs-on: ubuntu-latest
    if: vars.PUBLICAR_INSTAGRAM == 'sim'
    env:
      MODO_TESTE: ${{ inputs.modo_teste || vars.MODO_TESTE || 'sim' }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/contar_enquete.py
      - run: |
          git config user.name "odonto-em-5-bot"
          git config user.email "odonto-em-5-bot@users.noreply.github.com"
          git add edicoes posts
          git diff --cached --quiet || (git commit -m "Resultado da enquete" && git push)
