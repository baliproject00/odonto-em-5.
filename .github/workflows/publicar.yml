name: Publicar edição (Instagram + newsletter)

on:
  schedule:
    - cron: "3 9 * * 1"   # segunda, 6h03 em Brasília: o GitHub pode atrasar, e a margem garante a entrega até ~6h30
  workflow_dispatch:
    inputs:
      data:
        description: "Data da edição (AAAA-MM-DD). Em branco = hoje"
        required: false
      email_teste:
        description: "Enviar só para este(s) e-mail(s), como teste (separe por vírgula). Em branco = lista inteira"
        required: false
      teste_lista:
        description: "Teste para a lista inteira: envia com [Teste] no assunto, não publica no Instagram e não marca a edição como enviada"
        type: choice
        options: ["não", "sim"]
        default: "não"
      modo_teste:
        description: "Modo teste (não publica nada)"
        type: choice
        options: ["sim", "não"]
        default: "sim"

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      DATA_EDICAO: ${{ inputs.data }}
      # Em execuções agendadas, vale a variável MODO_TESTE do repositório (comece com "sim").
      MODO_TESTE: ${{ inputs.modo_teste || vars.MODO_TESTE || 'sim' }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_LISTA_ID: ${{ secrets.BREVO_LISTA_ID || vars.BREVO_LISTA_ID }}
      BREVO_REMETENTE_EMAIL: ${{ secrets.BREVO_REMETENTE_EMAIL || vars.BREVO_REMETENTE_EMAIL }}
      BREVO_REMETENTE_NOME: ${{ vars.BREVO_REMETENTE_NOME }}
      BREVO_EMAIL_TESTE: ${{ inputs.email_teste || vars.BREVO_EMAIL_TESTE }}
      TESTE_LISTA: ${{ inputs.teste_lista || 'não' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # sempre a versão mais nova (evita publicar duas vezes se duas execuções se cruzarem)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Publicar carrossel e comentário-enquete
        if: vars.PUBLICAR_INSTAGRAM == 'sim' && !inputs.email_teste && inputs.teste_lista != 'sim'
        run: python scripts/publicar_instagram.py
      - name: Enviar newsletter
        if: always()
        run: python scripts/enviar_newsletter.py
      - name: Registrar o que foi publicado
        if: always()
        run: |
          git config user.name "odonto-em-5-bot"
          git config user.email "odonto-em-5-bot@users.noreply.github.com"
          git add edicoes posts
          git diff --cached --quiet || (git commit -m "Registro de publicação" && git push)
